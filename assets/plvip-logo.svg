<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Players League VIP logo</title>
  <desc id="desc">A premium black coin with a gold P and silver L monogram.</desc>
  <defs>
    <radialGradient id="face" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#252525"/>
      <stop offset="0.56" stop-color="#101114"/>
      <stop offset="1" stop-color="#030405"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2ad"/>
      <stop offset="0.20" stop-color="#f7cc55"/>
      <stop offset="0.52" stop-color="#a96508"/>
      <stop offset="0.72" stop-color="#ffd869"/>
      <stop offset="1" stop-color="#7d4304"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#d9dde3"/>
      <stop offset="0.58" stop-color="#7f858e"/>
      <stop offset="0.80" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#555b65"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3ae"/>
      <stop offset="0.18" stop-color="#d88e14"/>
      <stop offset="0.48" stop-color="#6c3500"/>
      <stop offset="0.70" stop-color="#ffd86f"/>
      <stop offset="1" stop-color="#9a5707"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity="0.62"/>
    </filter>
    <filter id="letterShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="10" dy="18" stdDeviation="8" flood-color="#000" flood-opacity="0.70"/>
    </filter>
  </defs>
  <circle cx="512" cy="512" r="475" fill="#050505" stroke="url(#rim)" stroke-width="34" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="443" fill="url(#face)" stroke="#f4c850" stroke-opacity="0.76" stroke-width="5"/>
  <circle cx="512" cy="512" r="425" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <path d="M253 297 H643 C724 297 775 347 775 425 C775 508 719 557 635 557 H491 L464 655 L323 761 L376 488 L451 412 H631 C655 412 670 399 670 378 C670 357 655 346 630 346 H294 Z" fill="url(#gold)" stroke="#5b2e00" stroke-width="8" stroke-linejoin="round" filter="url(#letterShadow)"/>
  <path d="M559 548 L672 490 L625 711 H800 L765 820 H499 Z" fill="url(#silver)" stroke="#454951" stroke-width="8" stroke-linejoin="round" filter="url(#letterShadow)"/>
  <path d="M275 314 H632" stroke="#fff7c9" stroke-opacity="0.68" stroke-width="8" stroke-linecap="round"/>
  <path d="M585 565 L672 521" stroke="#ffffff" stroke-opacity="0.58" stroke-width="7" stroke-linecap="round"/>
